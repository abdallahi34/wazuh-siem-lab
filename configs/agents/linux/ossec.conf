<!--
  Wazuh Agent Configuration — Linux (Ubuntu 22.04)
  Author: Abdellahi Ahmed Zerough

  Place at: /var/ossec/etc/ossec.conf on the Linux agent
  After editing: sudo systemctl restart wazuh-agent
-->

<ossec_config>

  <!-- ===================== CLIENT ===================== -->
  <client>
    <server>
      <!-- Replace with your Wazuh Manager IP -->
      <address>192.168.56.10</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <crypto_method>aes</crypto_method>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <!-- ===================== FILE INTEGRITY MONITORING (FIM) ===================== -->
  <!--
    FIM monitors directories for any create / modify / delete events.
    realtime="yes"       → continuous monitoring (inotify-based on Linux)
    check_all="yes"      → checks md5, sha1, sha256, size, owner, permissions, mtime
    report_changes="yes" → records the actual content diff in alerts
    whodata="yes"        → captures which user/process made the change (requires auditd)
  -->
  <syscheck>
    <disabled>no</disabled>
    <!-- Full scan every 6 hours -->
    <frequency>21600</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>

    <!-- Critical system config — real-time + who-data -->
    <directories check_all="yes" report_changes="yes" realtime="yes" whodata="yes">
      /etc
    </directories>

    <!-- Binaries — detect tampering or replacement -->
    <directories check_all="yes" realtime="yes">
      /usr/bin,/usr/sbin,/bin,/sbin
    </directories>

    <!-- Web root — detect webshell drops or defacement -->
    <directories check_all="yes" report_changes="yes" realtime="yes">
      /var/www/html
    </directories>

    <!-- SSH keys — detect unauthorized key additions -->
    <directories check_all="yes" report_changes="yes" realtime="yes">
      /home
    </directories>

    <!-- Ignore noisy / frequently changing paths -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore>/etc/resolv.conf</ignore>
    <ignore>/proc</ignore>
    <ignore type="sregex">.log$|.tmp$|.swp$|.pid$|.cache$</ignore>
  </syscheck>

  <!-- ===================== LOG ANALYSIS ===================== -->
  <!-- Authentication and login events -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <!-- General system log -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <!-- Package manager activity (apt installs, upgrades) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/dpkg.log</location>
  </localfile>

  <!-- Kernel messages (network, filesystem, hardware) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/kern.log</location>
  </localfile>

  <!-- UFW/iptables firewall logs -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/ufw.log</location>
  </localfile>

  <!-- Cron job executions -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/cron.log</location>
  </localfile>

  <!-- Disk usage check every 6 minutes -->
  <localfile>
    <log_format>command</log_format>
    <command>df -P</command>
    <frequency>360</frequency>
  </localfile>

  <!-- Active network connections — useful for detecting reverse shells -->
  <localfile>
    <log_format>full_command</log_format>
    <command>ss -tulwn</command>
    <frequency>120</frequency>
  </localfile>

  <!-- ===================== ROOTCHECK ===================== -->
  <rootcheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <skip_nfs>yes</skip_nfs>
  </rootcheck>

  <!-- ===================== ACTIVE RESPONSE ===================== -->
  <!-- Allow active response commands from the manager (e.g. firewall-drop) -->
  <active-response>
    <disabled>no</disabled>
  </active-response>

</ossec_config>
