<!--
  Wazuh Agent Configuration — Windows 10
  Author: Abdellahi Ahmed Zerough

  Place at: C:\Program Files (x86)\ossec-agent\ossec.conf
  After editing: Restart "Wazuh" service via Services or:
    Restart-Service -Name wazuh
-->

<ossec_config>

  <!-- ===================== CLIENT ===================== -->
  <client>
    <server>
      <!-- Replace with your Wazuh Manager IP -->
      <address>192.168.56.10</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <crypto_method>aes</crypto_method>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <!-- ===================== FILE INTEGRITY MONITORING (FIM) ===================== -->
  <!--
    Windows FIM monitors both filesystem paths and registry keys.
    realtime="yes"       → continuous monitoring (ReadDirectoryChangesW API)
    check_all="yes"      → checks md5, sha256, size, owner, permissions, mtime
    report_changes="yes" → captures exact content diff for text files
    whodata="yes"        → captures which user/process made the change (requires Audit Policy)
  -->
  <syscheck>
    <disabled>no</disabled>
    <!-- Full scan every 6 hours -->
    <frequency>21600</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>

    <!-- Windows system directories — detect DLL/binary tampering -->
    <directories check_all="yes" realtime="yes">
      %WINDIR%\System32
    </directories>
    <directories check_all="yes" realtime="yes">
      %WINDIR%\SysWOW64
    </directories>

    <!-- Startup folder — detect persistence via startup items (T1547.001) -->
    <directories check_all="yes" report_changes="yes" realtime="yes">
      %PROGRAMDATA%\Microsoft\Windows\Start Menu\Programs\Startup
    </directories>

    <!-- User Desktop and Downloads — common malware drop locations -->
    <directories check_all="yes" report_changes="yes" realtime="yes">
      %USERPROFILE%\Desktop
    </directories>
    <directories check_all="yes" report_changes="yes" realtime="yes">
      %USERPROFILE%\Downloads
    </directories>

    <!-- Hosts file — detect DNS hijacking (T1565.001) -->
    <directories check_all="yes" report_changes="yes" whodata="yes">
      %WINDIR%\System32\drivers\etc
    </directories>

    <!-- Windows Registry — persistence and config changes -->
    <!-- Run keys — malware persistence (T1547.001) -->
    <windows_registry>
      HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run
    </windows_registry>
    <windows_registry>
      HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce
    </windows_registry>
    <windows_registry>
      HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Run
    </windows_registry>
    <!-- Services — detect new service creation (T1543.003) -->
    <windows_registry>
      HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services
    </windows_registry>
    <!-- UAC settings — detect UAC bypass attempts -->
    <windows_registry>
      HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Policies\System
    </windows_registry>

    <!-- Ignore noisy paths -->
    <ignore type="sregex">.log$|.tmp$|.etl$|.evtx$</ignore>
  </syscheck>

  <!-- ===================== LOG ANALYSIS — WINDOWS EVENT LOG ===================== -->
  <!-- Security events: login, logout, account changes, privilege use -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Security</location>
    <!-- Filter for the most relevant security event IDs:
         4624 = Successful logon
         4625 = Failed logon  ← brute-force detection
         4648 = Logon with explicit credentials
         4672 = Special privileges (admin logon)
         4720 = User account created
         4732 = User added to privileged group
         4756 = Member added to universal security group
    -->
    <query>
      Event/System[
        EventID=4624 or EventID=4625 or EventID=4648
        or EventID=4672 or EventID=4720 or EventID=4732 or EventID=4756
      ]
    </query>
  </localfile>

  <!-- System events: service start/stop, driver issues -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>System</location>
  </localfile>

  <!-- Application events -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Application</location>
  </localfile>

  <!-- PowerShell script block logging (T1059.001 detection) -->
  <!-- Requires enabling: HKLM\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging -->
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <query>Event/System[EventID=4104]</query>
  </localfile>

  <!-- Sysmon (if installed) — process creation, network connections, etc. -->
  <!-- Install Sysmon: https://docs.microsoft.com/sysinternals/sysmon -->
  <!--
  <localfile>
    <log_format>eventchannel</log_format>
    <location>Microsoft-Windows-Sysmon/Operational</location>
  </localfile>
  -->

  <!-- ===================== ROOTCHECK ===================== -->
  <rootcheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <windows_apps>./shared/win_applications_rcl.txt</windows_apps>
    <windows_malware>./shared/win_malware_rcl.txt</windows_malware>
  </rootcheck>

  <!-- ===================== ACTIVE RESPONSE ===================== -->
  <active-response>
    <disabled>no</disabled>
  </active-response>

</ossec_config>
