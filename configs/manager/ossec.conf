<!--
  Wazuh Manager Configuration — wazuh-siem-lab
  Author: Abdellahi Ahmed Zerough
  
  Place at: /var/ossec/etc/ossec.conf on the Wazuh Manager (Ubuntu Server)
  After editing: sudo systemctl restart wazuh-manager
-->

<ossec_config>

  <!-- ===================== GLOBAL ===================== -->
  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>
    <smtp_server>localhost</smtp_server>
    <email_from>wazuh@localhost</email_from>
    <email_to>admin@localhost</email_to>
    <email_maxperhour>12</email_maxperhour>
    <email_log_source>alerts.log</email_log_source>
    <agents_disconnection_time>10m</agents_disconnection_time>
    <agents_disconnection_alert_time>0</agents_disconnection_alert_time>
  </global>

  <!-- ===================== ALERTS ===================== -->
  <alerts>
    <!-- Minimum level to write to alerts.log -->
    <log_alert_level>3</log_alert_level>
    <!-- Minimum level to send email alerts -->
    <email_alert_level>12</email_alert_level>
  </alerts>

  <!-- ===================== REMOTE ===================== -->
  <!-- Accept connections from agents -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <queue_size>131072</queue_size>
  </remote>

  <!-- ===================== RULES ===================== -->
  <ruleset>
    <!-- Default ruleset -->
    <decoder_dir>ruleset/decoders</decoder_dir>
    <rule_dir>ruleset/rules</rule_dir>
    <rule_exclude>0215-policy_rules.xml</rule_exclude>
    <list>etc/lists/audit-keys</list>
    <list>etc/lists/amazon/aws-eventnames</list>
    <list>etc/lists/security-eventchannel</list>

    <!-- Custom rules — loaded AFTER default rules -->
    <rule_dir>etc/rules</rule_dir>
  </ruleset>

  <!-- ===================== ACTIVE RESPONSE ===================== -->
  <!-- Block attacker IPs via iptables when SSH brute-force detected -->
  <command>
    <name>firewall-drop</name>
    <executable>firewall-drop</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <active-response>
    <!-- Trigger on custom SSH brute-force rule (100001) and built-in (5712, 5763) -->
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>100001,5712,5763</rules_id>
    <!-- Block for 10 minutes (600 seconds) -->
    <timeout>600</timeout>
  </active-response>

  <!-- ===================== FILE INTEGRITY MONITORING ===================== -->
  <!-- Manager-side FIM (monitors manager's own critical files) -->
  <syscheck>
    <disabled>no</disabled>
    <!-- Run full scan every 6 hours -->
    <frequency>21600</frequency>
    <scan_on_start>yes</scan_on_start>
    <!-- Alert on new files -->
    <alert_new_files>yes</alert_new_files>

    <!-- Monitor Wazuh configuration and rules -->
    <directories check_all="yes" report_changes="yes" realtime="yes">
      /var/ossec/etc
    </directories>
    <directories check_all="yes" report_changes="yes" realtime="yes">
      /var/ossec/etc/rules
    </directories>

    <!-- Monitor system-level paths -->
    <directories check_all="yes">/etc,/usr/bin,/usr/sbin</directories>
    <directories check_all="yes">/bin,/sbin</directories>

    <!-- Ignore noisy paths -->
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <ignore>/etc/mail/statistics</ignore>
    <ignore>/etc/random-seed</ignore>
    <ignore>/etc/adjtime</ignore>
    <ignore type="sregex">.log$|.tmp$|.swp$</ignore>
  </syscheck>

  <!-- ===================== LOG ANALYSIS ===================== -->
  <!-- Manager's own logs -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/dpkg.log</location>
  </localfile>

  <localfile>
    <log_format>command</log_format>
    <command>df -P</command>
    <frequency>360</frequency>
  </localfile>

  <!-- ===================== VULNERABILITY DETECTION ===================== -->
  <vulnerability-detection>
    <enabled>yes</enabled>
    <index-status>yes</index-status>
    <feed-update-interval>60m</feed-update-interval>
  </vulnerability-detection>

  <!-- ===================== ROOTCHECK ===================== -->
  <rootcheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <rootkit_files>
      /var/ossec/etc/shared/rootkit_files.txt
    </rootkit_files>
    <rootkit_trojans>
      /var/ossec/etc/shared/rootkit_trojans.txt
    </rootkit_trojans>
    <skip_nfs>yes</skip_nfs>
  </rootcheck>

</ossec_config>
